<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="lavender" x1="250" y1="260" x2="760" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".48" stop-color="#E9DFFF"/>
      <stop offset="1" stop-color="#9870FF"/>
    </linearGradient>
    <linearGradient id="purple" x1="430" y1="170" x2="620" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C8A5FF"/>
      <stop offset="1" stop-color="#7540E8"/>
    </linearGradient>
    <linearGradient id="cloud" x1="330" y1="600" x2="650" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".62" stop-color="#E7DBFF"/>
      <stop offset="1" stop-color="#A47AFF"/>
    </linearGradient>
    <linearGradient id="ear" x1="340" y1="390" x2="685" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A77BFF"/>
      <stop offset="1" stop-color="#E7D9FF"/>
    </linearGradient>
    <filter id="shadow" x="150" y="120" width="730" height="820" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <!-- subtle grounding shadow -->
